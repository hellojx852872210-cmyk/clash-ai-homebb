# 由 clash-ai-homebb genconfig.py 生成于 2026-09-19 03:00。改 deadchain.toml 重新生成，不要手改。
# 语义：AI 域名/进程/家宽入站口 → AI 组 → 家宽组（只有家宽节点，没有 DIRECT，挂了就断线）；
#       其它流量 → 日常出口（各订阅 url-test + fallback，能通哪条走哪条）。
find-process-mode: always
ipv6: false
proxy-providers:
  "sub-airport-a": {"path": "./ai-homebb-providers/airport-a.yaml", "exclude-filter": "到期|流量|重置|获取|剩余|套餐|官网|Traffic|Expire|Reset", "override": {"additional-prefix": "[airport-a] "}, "health-check": {"enable": true, "url": "http://www.gstatic.com/generate_204", "interval": 300}, "type": "http", "url": "https://a.example/sub?target=clash", "interval": 86400}
  "sub-airport-b": {"path": "./ai-homebb-providers/airport-b.yaml", "exclude-filter": "到期|流量|重置|获取|剩余|套餐|官网|Traffic|Expire|Reset", "override": {"additional-prefix": "[airport-b] "}, "health-check": {"enable": true, "url": "http://www.gstatic.com/generate_204", "interval": 300}, "type": "http", "url": "https://b.example/sub?target=clash", "interval": 86400}
prepend-proxies:
- {"name": "RESIP-A", "type": "vless", "server": "entry-a.example.com", "port": 443, "uuid": "00000000-0000-0000-0000-000000000000", "network": "tcp", "udp": false, "tls": true, "flow": "xtls-rprx-vision", "servername": "swdist.apple.com", "client-fingerprint": "chrome", "reality-opts": {"public-key": "REPLACE_WITH_PUBLIC_KEY", "short-id": "0123abcd"}, "interface-name": "en0"}
- {"name": "HOME-SOCKS", "type": "socks5", "server": "203.0.113.5", "port": 1080, "username": "user", "password": "pass", "udp": false, "interface-name": "en0"}
prepend-proxy-groups:
- {"name": "airport-a-自动", "type": "url-test", "use": ["sub-airport-a"], "url": "http://www.gstatic.com/generate_204", "interval": 300, "tolerance": 100, "lazy": false}
- {"name": "airport-b-自动", "type": "url-test", "use": ["sub-airport-b"], "url": "http://www.gstatic.com/generate_204", "interval": 300, "tolerance": 100, "lazy": false}
- {"name": "日常-自动", "type": "fallback", "proxies": ["airport-a-自动", "airport-b-自动"], "url": "http://www.gstatic.com/generate_204", "interval": 120, "lazy": false}
- {"name": "日常出口", "type": "select", "proxies": ["日常-自动", "airport-a-自动", "airport-b-自动"]}
- {"name": "RESIP-Claude", "type": "fallback", "url": "http://www.gstatic.com/generate_204", "interval": 120, "lazy": false, "proxies": ["RESIP-A", "HOME-SOCKS"]}
- {"name": "Claude-Only", "type": "select", "proxies": ["RESIP-Claude"]}
